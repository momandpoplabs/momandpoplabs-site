<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mom and Pop Labs</title>
<meta name="description" content="Mom and Pop Labs is an independent software studio.">
<style>
  :root {
    --bg: #101214; --ink: #C9CFD6; --muted: #8A939C; --line: rgba(201,207,214,.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-size: 15px; line-height: 1.7;
  }
  .wrap { max-width: 600px; margin: 0 auto; padding: 96px 24px 72px; }
  h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 4px; letter-spacing: .01em; }
  .role { color: var(--muted); margin: 0 0 36px; }
  hr { border: none; border-top: 1px solid var(--line); margin: 36px 0; }
  p { margin: 0 0 10px; }
  .label { color: var(--muted); font-size: .82rem; margin-bottom: 2px; }
  a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--line); }
  a:hover, a:focus-visible { border-bottom-color: var(--ink); }
  a:focus-visible { outline: 2px solid var(--muted); outline-offset: 3px; }
  footer { color: var(--muted); font-size: .82rem; display: flex; gap: 18px; flex-wrap: wrap; }
</style>
</head>
<body>
  <main class="wrap">
    <h1>Mom and Pop Labs</h1>
    <p class="role">Independent software studio</p>

    <hr>

    <p class="label">Contact</p>
    <p><a href="mailto:support@momandpoplabs.com">support@momandpoplabs.com</a></p>

    <hr>

    <footer>
      <span>© 2026 Mom and Pop Labs LLC</span>
      <a href="/privacy.html">Privacy</a>
    </footer>
  </main>
</body>
</html>
