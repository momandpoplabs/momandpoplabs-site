<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mom and Pop Labs</title>
<meta name="description" content="Mom and Pop Labs is an independent software studio.">
<style>
  :root {
    --paper: #FAFAF8; --ink: #1C1B18; --soft: rgba(28,27,24,.6); --line: rgba(28,27,24,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #161513; --ink: #E9E7E1; --soft: rgba(233,231,225,.6); --line: rgba(233,231,225,.14);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", -apple-system, sans-serif;
    line-height: 1.6; font-size: 16px;
    min-height: 100vh; display: flex; align-items: center;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 48px 24px; width: 100%; }
  h1 {
    font-size: 1.05rem; font-weight: 700; letter-spacing: .16em;
    text-transform: uppercase; margin: 0 0 10px;
  }
  p { margin: 0 0 8px; color: var(--soft); }
  a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  footer {
    margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--line);
    font-size: .82rem; color: var(--soft); display: flex; gap: 16px; flex-wrap: wrap;
  }
</style>
</head>
<body>
  <main class="wrap">
    <h1>Mom and Pop Labs</h1>
    <p>An independent software studio.</p>
    <p><a href="mailto:support@momandpoplabs.com">support@momandpoplabs.com</a></p>
    <footer>
      <span>© 2026 Mom and Pop Labs LLC</span>
      <a href="/privacy.html">Privacy</a>
    </footer>
  </main>
</body>
</html>
