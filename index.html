<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mom and Pop Labs</title>
<meta name="description" content="Mom and Pop Labs is an independent software studio.">
<style>
  :root {
    --paper: #F6F3EC; --ink: #23211C; --soft: rgba(35,33,28,.62); --faint: rgba(35,33,28,.38);
    --accent: #B4451F; --card: #FFFFFF; --line: rgba(35,33,28,.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #191713; --ink: #EFEAE0; --soft: rgba(239,234,224,.66); --faint: rgba(239,234,224,.4);
      --accent: #E8804F; --card: #221F1A; --line: rgba(239,234,224,.14);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", -apple-system, sans-serif;
    line-height: 1.6; font-size: 17px;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 88px 24px 64px; }
  .mark {
    font-size: .78rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    font-size: clamp(1.9rem, 5.5vw, 2.6rem); line-height: 1.15; margin: 14px 0 16px;
    font-weight: 700; letter-spacing: -.01em; text-wrap: balance;
  }
  p { margin: 0 0 14px; color: var(--soft); max-width: 56ch; }
  .now {
    margin-top: 40px; padding: 20px 22px; background: var(--card);
    border: 1px solid var(--line); border-radius: 12px;
  }
  .now .tag {
    font-size: .72rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
    color: var(--faint); margin-bottom: 6px;
  }
  .now p { margin: 0; font-size: .98rem; }
  .contact { margin-top: 40px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover, a:focus-visible { text-decoration: underline; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  footer {
    margin-top: 72px; padding-top: 20px; border-top: 1px solid var(--line);
    font-size: .85rem; color: var(--faint); display: flex; gap: 18px; flex-wrap: wrap;
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="mark">Mom and Pop Labs</div>
    <h1>An independent software studio.</h1>
    <p>We design and build our own apps, start to finish.</p>

    <section class="now" aria-label="Status">
      <div class="tag">Status</div>
      <p>Our first title is in development. Details when it's ready.</p>
    </section>

    <section class="contact">
      <p>Support and inquiries:<br>
      <a href="mailto:support@momandpoplabs.com">support@momandpoplabs.com</a></p>
    </section>

    <footer>
      <span>© 2026 Mom and Pop Labs LLC</span>
      <a href="/privacy.html">Privacy</a>
    </footer>
  </main>
</body>
</html>
